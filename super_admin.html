{% extends "base.html" %}{% block content %}<h1>Super Admin Dashboard</h1><div class="grid"><div class="card"><h2>Onboard Admin</h2><form method="post" action="{{url_for('create_admin')}}"><input name="username" placeholder="Admin username" required><input name="password" type="password" placeholder="Password" required><button>Create Admin</button></form></div><div class="card"><h2>Add Float</h2><form method="post" action="{{url_for('add_float')}}"><select name="admin_id">{% for a in admins %}<option value="{{a.id}}">{{a.username}}</option>{% endfor %}</select><input name="amount" type="number" min="1" placeholder="Amount" required><button>Add Float</button></form></div></div><div class="card"><h2>Admins</h2><table><tr><th>Admin</th><th>Float</th></tr>{% for a in admins %}<tr><td>{{a.username}}</td><td>{{a.balance}}</td></tr>{% endfor %}</table></div>{% endblock %}
