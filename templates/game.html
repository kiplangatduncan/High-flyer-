{% extends "base.html" %}
{% block content %}
<div class="game-shell">
    <div class="game-top">
        <div class="multiplier">1.00x</div>
        <div class="brand-small">HIGH FLYER</div>
        <div class="live">● LIVE</div>
    </div>

    <div class="game-stage">
        <div class="sky">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="tower">✦</div>
            <div id="aircraft">✈</div>
        </div>
        <div class="game-message" id="gameMessage">WAITING FOR ROUND</div>
    </div>

    <div class="player-strip">
        {% for player in players %}
        <div class="player-card">
            <div class="number">{{ loop.index }}</div>
            <div>
                <strong>{{ player.username }}</strong>
                <small>KES {{ "%.2f"|format(player.balance) }}</small>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
const socket = io();
socket.emit("join_game", {username: "{{ session.get('username') }}"});

let value = 1.00;
const multiplier = document.querySelector(".multiplier");
const aircraft = document.getElementById("aircraft");
const message = document.getElementById("gameMessage");

setInterval(() => {
    value += 0.01;
    multiplier.textContent = value.toFixed(2) + "x";
    aircraft.style.transform = `translate(${Math.min(value * 12, 500)}px, ${-Math.min(value * 5, 170)}px)`;
    message.textContent = "FLYING";
}, 120);

socket.on("player_joined", (data) => {
    console.log(data.username + " joined");
});
</script>
{% endblock %}
